<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Toast Notification demo</title>
    <style>
      html, body { margin: 0; }
      body { background: #f5f5f7; padding: 16px; font-family: Arial, Helvetica, sans-serif; }
      body.dark { background: #121215; }
      #root { background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
      body.dark #root { background: #1f1f24; }
      /* A neutral sample sheet behind the Overlay; not a copy of any product UI. */
      .sample-sheet { display: none; }
      body.sheet { padding: 0; }
      body.sheet .sample-sheet { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr 1fr; gap: 12px; padding: 16px; height: 100vh; box-sizing: border-box; }
      .tile { background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .tile h3 { margin: 0; font-size: 13px; color: #404040; }
      .tile .kpi { font-size: 34px; font-weight: 700; color: #14122b; }
      .tile svg { flex: 1; width: 100%; }
      .wide { grid-column: span 2; }
    </style>
  </head>
  <body>
    <div class="sample-sheet">
      <div class="tile"><h3>Revenue</h3><div class="kpi">$4.2M</div></div>
      <div class="tile"><h3>Orders</h3><div class="kpi">18,240</div></div>
      <div class="tile"><h3>Margin</h3><div class="kpi">31.4%</div></div>
      <div class="tile wide"><h3>Revenue by month</h3>
        <svg viewBox="0 0 300 100" preserveAspectRatio="none"><g fill="#8e9aaf">
          <rect x="5" y="60" width="18" height="40"/><rect x="30" y="45" width="18" height="55"/><rect x="55" y="50" width="18" height="50"/><rect x="80" y="30" width="18" height="70"/><rect x="105" y="38" width="18" height="62"/><rect x="130" y="25" width="18" height="75"/><rect x="155" y="35" width="18" height="65"/><rect x="180" y="20" width="18" height="80"/><rect x="205" y="28" width="18" height="72"/><rect x="230" y="15" width="18" height="85"/><rect x="255" y="22" width="18" height="78"/><rect x="280" y="10" width="15" height="90"/></g></svg>
      </div>
      <div class="tile"><h3>Region</h3>
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#c9d1df" stroke-width="18"/><circle cx="50" cy="50" r="38" fill="none" stroke="#8e9aaf" stroke-width="18" stroke-dasharray="150 239" transform="rotate(-90 50 50)"/></svg>
      </div>
      <div class="tile wide"><h3>Top products</h3>
        <svg viewBox="0 0 300 100" preserveAspectRatio="none"><g fill="#8e9aaf"><rect x="0" y="5" width="280" height="14"/><rect x="0" y="27" width="230" height="14"/><rect x="0" y="49" width="190" height="14"/><rect x="0" y="71" width="140" height="14"/></g></svg>
      </div>
      <div class="tile"><h3>Returns</h3><div class="kpi">2.1%</div></div>
    </div>
    <div id="root"></div>
    <div id="overlay-host"></div>
    <script src="demo.js"></script>
  </body>
</html>
